name: EduPath AI CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest-cov pip-audit

      - name: Verify Code Compilation & Syntax
        run: |
          python -m compileall backend/app/ backend/tests/

      - name: Ruff Code Quality & Lint Verification
        run: |
          ruff check backend/app/

      - name: MyPy Static Type Check
        run: |
          cd backend && mypy --explicit-package-bases app/core/ app/models/

      - name: Validate Alembic Migrations
        run: |
          cd backend && python -m alembic check

      - name: Execute Pytest Suite with Coverage (All 70 Tests)
        env:
          JWT_SECRET: "ci_testing_secret_key_minimum_32_characters_strictly_for_ci"
          DATABASE_URL: "sqlite+aiosqlite:///ci_test.db"
          ENVIRONMENT: "testing"
          GEMINI_API_KEY: ""
        run: |
          cd backend && pytest -v --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Execute Automated Smoke Test Probe
        env:
          JWT_SECRET: "ci_testing_secret_key_minimum_32_characters_strictly_for_ci"
          DATABASE_URL: "sqlite+aiosqlite:///ci_test_smoke.db"
        run: |
          python backend/tests/smoke_test.py

      - name: Backend Dependency Vulnerability Audit (Strict Gate)
        # Documented exceptions: PYSEC-2026-4298 and PYSEC-2026-1325 (python-jose / ecdsa).
        # EduPath AI enforces HS256 HMAC-SHA256 exclusively; asymmetric ECDSA routines are deactivated.
        run: |
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-4298 --ignore-vuln PYSEC-2026-1325

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 7

  frontend-ci:
    name: Frontend CI Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Route Integrity & Component Smoke Tests
        working-directory: ./frontend
        run: npm test

      - name: ESLint Code Quality Gate
        working-directory: ./frontend
        run: npm run lint

      - name: TypeScript Static Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Production Static Prerendering Build
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

      - name: Frontend Dependency Vulnerability Audit (Strict Gate)
        working-directory: ./frontend
        run: node scripts/audit_check.mjs

  infrastructure-ci:
    name: Infrastructure & Container Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose Configurations
        env:
          REDIS_PASSWORD: "ci_dummy_password"
          DATABASE_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci"
          JWT_SECRET: "ci_dummy_secret_32_characters_long_min"
          ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.prod.yml config

      - name: Validate Backend Dockerfile
        run: |
          docker build --check -f backend/Dockerfile backend/

      - name: Validate Frontend Dockerfile
        run: |
          docker build --check -f frontend/Dockerfile frontend/
