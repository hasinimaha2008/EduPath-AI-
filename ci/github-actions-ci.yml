name: EduPath AI CI / CD Pipeline

on:
  push:
    branches: [ master, main, upgrade/* ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-qa:
    name: Backend Lint, Test & Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Database Catalog
        working-directory: ./backend
        run: |
          python -m app.core.init_db

      - name: Run Pytest Test Suite
        working-directory: ./backend
        run: |
          python -m pytest tests/test_api.py tests/test_security_regression.py -v

      - name: Run RAG 50-Question Benchmark
        working-directory: ./backend
        run: |
          python tests/verify_rag_50_benchmark.py

      - name: Run Independent RAG Benchmark
        working-directory: ./backend
        run: |
          python tests/independent_rag_benchmark.py

      - name: Start Background FastAPI Server
        working-directory: ./backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Run Master QA Security & Latency Audit
        working-directory: ./backend
        run: |
          python tests/master_qa_audit.py

      - name: Run Deep Feature Backtesting
        working-directory: ./backend
        run: |
          python tests/deep_feature_audit.py

      - name: Run Live User Journey Verification
        working-directory: ./backend
        run: |
          python tests/live_user_journey.py

  frontend-qa:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run ESLint Verification
        working-directory: ./frontend
        run: |
          npm run lint

      - name: Run Next.js Production Build
        working-directory: ./frontend
        run: |
          npm run build
