name: EduPath AI Production CI / CD Pipeline

on:
  push:
    branches: [ master, main, upgrade/* ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend Test, Security, RAG & Integrity Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      JWT_SECRET: "ci-test-secure-jwt-secret-string-at-least-32-chars-long"
      DATABASE_URL: "sqlite+aiosqlite:///./test_ci.db"
      GEMINI_API_KEY: ""
      ALLOW_DEMO_LOGIN: "true"
      UPLOAD_DIR: "./uploads"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Database Catalog & Taxonomy
        working-directory: ./backend
        run: |
          python -m app.core.init_db

      - name: Run Pytest Test Suites (42 Tests)
        working-directory: ./backend
        run: |
          python -m pytest tests/test_api.py tests/test_security_regression.py tests/test_assistant_correctness.py tests/test_backup_restore.py tests/test_path_security.py -v

      - name: Run Comprehensive 100-Question RAG Benchmark
        working-directory: ./backend
        run: |
          python tests/rag_comprehensive_100_evaluation.py

      - name: Run Standard RAG 50-Question Information Retrieval Benchmark
        working-directory: ./backend
        run: |
          python tests/verify_rag_50_benchmark.py

      - name: Run Independent 56-Query Multi-Domain Benchmark
        working-directory: ./backend
        run: |
          python tests/independent_rag_benchmark.py

      - name: Start Background FastAPI Server
        working-directory: ./backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 4

      - name: Run Master QA Security & Latency Audit (18 Suites)
        working-directory: ./backend
        run: |
          python tests/master_qa_audit.py

      - name: Run Deep Feature-by-Feature Backtesting (12 Features)
        working-directory: ./backend
        run: |
          python tests/deep_feature_audit.py

      - name: Run Live User Journey Verification (11 Steps)
        working-directory: ./backend
        run: |
          python tests/live_user_journey.py

      - name: Upload RAG 100 Benchmark Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-100-benchmark-report
          path: backend/tests/rag_100_benchmark_report.json
          retention-days: 14

  frontend-qa:
    name: Frontend Lint & Production Static Prerendering Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run ESLint Verification
        working-directory: ./frontend
        run: |
          npm run lint

      - name: Run Next.js Production Build (22 Static Routes)
        working-directory: ./frontend
        run: |
          npm run build
