version: "3.8"

networks:
  frontend-ingress:
    driver: bridge
  backend-internal:
    driver: bridge
    internal: true

services:
  redis:
    image: redis:7-alpine
    container_name: edupath-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Mandatory REDIS_PASSWORD is missing}
    # Notice: No external host ports exposed in production. Isolated inside internal network.
    volumes:
      - redis-prod-data:/data
    networks:
      - backend-internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/hasinimaha2008/edupath-backend:${IMAGE_TAG:-latest}
    container_name: edupath-backend-prod
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:?Mandatory DATABASE_URL is missing}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ALLOW_DEMO_LOGIN=false
      - JWT_SECRET=${JWT_SECRET:?Mandatory JWT_SECRET is missing}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?Mandatory ALLOWED_ORIGINS is missing}
      - UPLOAD_DIR=/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend-prod-uploads:/app/uploads
      - backend-prod-data:/app/data
      - backend-prod-backups:/app/backups
    networks:
      - frontend-ingress
      - backend-internal
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/hasinimaha2008/edupath-frontend:${IMAGE_TAG:-latest}
    container_name: edupath-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?Mandatory NEXT_PUBLIC_API_URL is missing}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-ingress
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  backend-prod-uploads:
    name: edupath_prod_uploads
  backend-prod-data:
    name: edupath_prod_data
  backend-prod-backups:
    name: edupath_prod_backups
  redis-prod-data:
    name: edupath_prod_redis_data
