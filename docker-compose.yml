version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: edupath-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edupath-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PORT=${PORT:-8000}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/edupath.db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ALLOW_DEMO_LOGIN=${ALLOW_DEMO_LOGIN:-false}
      - JWT_SECRET=${JWT_SECRET:?Mandatory JWT_SECRET environment variable is missing for production deployment}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - UPLOAD_DIR=/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads
      - backend-db:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edupath-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  backend-uploads:
  backend-db:
  redis-data:
