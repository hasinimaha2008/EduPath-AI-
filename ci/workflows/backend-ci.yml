name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "ci/**"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "ci/**"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test-and-lint:
    name: Backend Quality & Test Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pip-audit pytest-cov

      - name: Syntax & Compilation Check
        run: python -m compileall app/ tests/

      - name: Ruff Lint Gate
        run: ruff check app/

      - name: MyPy Type Gate
        run: mypy --explicit-package-bases app/core/ app/models/

      - name: Run Pytest Suite with Coverage (All 70 Tests)
        env:
          JWT_SECRET: "ci_testing_secret_key_minimum_32_characters_strictly_for_ci"
          DATABASE_URL: "sqlite+aiosqlite:///ci_pytest.db"
          ENVIRONMENT: "testing"
          GEMINI_API_KEY: ""
        run: pytest -v --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing --junitxml=junit-test-results.xml

      - name: Run Alembic Migration Lifecycle Safety Test
        env:
          JWT_SECRET: "ci_testing_secret_key_minimum_32_characters_strictly_for_ci"
        run: pytest -v tests/test_migrations.py

      - name: Run Security Regression Suite
        env:
          JWT_SECRET: "ci_testing_secret_key_minimum_32_characters_strictly_for_ci"
        run: pytest -v tests/test_security_regression.py

      - name: Run End-to-End Live User Journey (11 Steps)
        env:
          JWT_SECRET: "ci_testing_secret_key_minimum_32_characters_strictly_for_ci"
        run: python tests/live_user_journey.py

      - name: Run Automated Post-Deploy Smoke Test (8 Steps)
        env:
          JWT_SECRET: "ci_testing_secret_key_minimum_32_characters_strictly_for_ci"
        run: python tests/smoke_test.py

      - name: Upload Test Report & Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/junit-test-results.xml
            backend/coverage.xml
          retention-days: 14
